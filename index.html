
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v7.0.0/dist/aframe-extras.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  </head>
 <body>
  <!-- <div id="statusText"
    style="position: fixed; top: 12px; left: 12px; z-index: 9999; background: rgba(0,0,0,0.7); color: #fff; padding: 8px 10px; border-radius: 6px; font-family: Arial, sans-serif; white-space: pre-line;">
    waiting for targets
  </div> -->
  <!-- maximum 1 target at a time ! -->
  <a-scene mindar-image="imageTargetSrc: targets.mind; maxTrack: 1;" color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">
    <a-assets timeout="10000">
  <video
    id="VIDEO0"
    src="./videos/VIDEO0.mp4"
    preload="auto"
    loop
    playsinline
    muted
    crossorigin="anonymous">
  </video>

  <video
    id="VIDEO1"
    src="./videos/VIDEO1.mp4"
    preload="auto"
    loop
    playsinline
    muted
    crossorigin="anonymous">
  </video>
</a-assets>

    <a-entity id="target0" mindar-image-target="targetIndex: 0">
      <a-video src="#VIDEO0"
  position="0 0 0"
  width="1"
  height="0.65">
</a-video>
    </a-entity>

    <a-entity id="target1" mindar-image-target="targetIndex: 1">
     <a-video src="#VIDEO1"
  position="0 0 0"
  width="1"
  height="0.65">
</a-video>
    </a-entity>
<a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
  </a-scene>
  </body>
</html>
